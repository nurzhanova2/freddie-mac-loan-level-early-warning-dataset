recommended_main_extension:
  selection_rule: one acquisition cohort, Q1, for each year from 2006 through 2024
  rationale:
    - includes pre-crisis, crisis, post-crisis, pandemic, and recent origination environments
    - avoids the unnecessary volume of all quarterly cohorts in the first dissertation iteration
